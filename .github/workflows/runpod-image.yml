# Build the RunPod worker image (crates/docling-serve/Dockerfile.runpod, its
# final stage) on GitHub Actions and push it to GHCR, for a RunPod endpoint
# that pulls the image rather than building it: RunPod's GitHub builds cap
# `docker build` at 30 minutes, too short to compile docling-serve with CUDA.
#
# Trigger: push a tag `runpod-img-<anything>`. Tags pushed:
#   ghcr.io/<owner>/docling-rs-runpod:<tag> and :latest
name: runpod-image

on:
  push:
    tags: ["runpod-img-*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/docling-serve/Dockerfile.runpod
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/docling-rs-runpod:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/docling-rs-runpod:latest
          cache-from: type=gha,scope=runpod-binary
          cache-to: type=gha,mode=max,scope=runpod-binary
      - name: Image size
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/docling-rs-runpod:${{ github.ref_name }} --raw \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print('layers:', len(m.get('layers',[])), 'compressed MB:', round(sum(l.get('size',0) for l in m.get('layers',[]))/1e6))" || true
